plugins { id 'com.android.application' }

android {
    namespace 'app.st4737.baocao'
    compileSdk 34

    defaultConfig {
        applicationId 'app.st4737.baocao'
        minSdk 29          // Android 10 trở lên
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            // Ký bằng khóa debug để cài trực tiếp (sideload). Muốn lên Play Store thì thay bằng keystore riêng.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
}
